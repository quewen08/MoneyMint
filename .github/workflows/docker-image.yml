name: build-and-push

# 触发策略：
#   - push develop/master：只跑校验（go vet + test + bean-check + 版本一致），不产镜像
#     → 相当于免费的 CI 守护，每次提交就知道有没有破坏账芯
#   - push tag v*：校验通过后构建 amd64+arm64 并推送 Docker Hub
#   - workflow_dispatch：手动触发；默认只校验，勾选 push_image 才真正推镜像
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      push_image:
        description: '同时构建并推送镜像到 Docker Hub'
        type: boolean
        default: false

env:
  # 镜像名沿用老板既有的 Docker Hub 仓库名（money-mint），
  # 与 docker-compose.yml 的默认镜像保持一致，改一处必须同步另一处。
  IMAGE_NAME: money-mint

jobs:
  # ---------- 第一道门：校验不过，绝不产出镜像 ----------
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Check Server Performance(检查服务器性能)
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - uses: actions/checkout@v4
        with:
          # verify-version.sh 需要 tag 才能比对，浅克隆只有 1 个提交拿不到 tag
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 关键：必须真的装上 beancount。
      # 若此步静默失败，后续 go test 会因 BEAN_CHECK_STRICT=1 而失败 —— 这正是设计意图：
      # 宁可构建失败，也不要「测试全绿但账芯从未被校验」的假绿灯。
      - name: Install beancount (bean-check)
        run: |
          python -m pip install --upgrade pip
          pip install beancount
          python -m beancount.scripts.check --help >/dev/null

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "解析出版本：${V}"

      - name: Verify version consistency
        run: bash scripts/verify-version.sh "${{ steps.ver.outputs.version }}"

      - name: go vet
        run: go vet ./...

      - name: go test (strict bean-check)
        env:
          BEAN_CHECK_STRICT: '1'
        run: go test ./... -v

      - name: bean-check self check
        run: bash scripts/check-bean.sh

  # ---------- 第二道门：前端门禁（web-verify，批 6 补齐） ----------
  # RK-10：门禁必须覆盖 vitest + build，且用例数有下限防「文件加载失败只剩 3 个用例」的假绿。
  # Node 版本经 node-version-file 读 frontend/.nvmrc（22.23.4），与 Dockerfile / engines 三处一致。
  web-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci（engine-strict 校验 Node 版本）
        working-directory: frontend
        run: npm ci

      - name: Vitest 全量 + 用例数下限（防假绿）
        working-directory: frontend
        env:
          TEST_FLOOR: '280'
        run: |
          npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json
          node ../scripts/check-test-floor.mjs vitest-report.json "$TEST_FLOOR"

      - name: 类型检查（vue-tsc）
        working-directory: frontend
        run: npm run typecheck

      - name: 构建（vue-tsc + vite build，es2015 产物）
        working-directory: frontend
        run: npm run build

      - name: 兼容门禁（es2020 语法 + §14.7 API/CSS 特性扫描）
        working-directory: frontend
        run: npm run compat

  # ---------- 第三道门：双架构构建并推送 ----------
  # 仅两种情况产镜像：
  #   1) 推 tag v*（正式发布）
  #   2) 手动 workflow_dispatch 且勾选了 push_image
  # 普通分支 push 只跑前面的校验，不会动 Docker Hub。
  build:
    needs: [verify, web-verify]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_image == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check Server Performance(检查服务器性能)
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build info
        id: info
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 是 NAS 的主力架构，必须与 amd64 一起产出
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ steps.info.outputs.date }}
            BUILD_HASH=${{ steps.info.outputs.hash }}
            GIT_VERSION=${{ needs.verify.outputs.version }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          # Node/Vite 构建较 Flutter 轻量，但 gha 缓存仍能省掉 npm ci 与重复编译
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已发布"
            echo ""
            echo "- 版本：\`${{ needs.verify.outputs.version }}\`"
            echo "- 架构：linux/amd64, linux/arm64"
            echo "- 标签：\`${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}\`、\`:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
